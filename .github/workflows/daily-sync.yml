name: Daily Government Jobs Sync

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'inbox_pdfs/*.pdf'

permissions:
  contents: write
  issues: write

jobs:
  sync-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: Install Python pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run daily recruitment collection pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          JOBFUL_API_URL: ${{ vars.JOBFUL_API_URL }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
        run: python scripts/fetch_jobs.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build Astro static site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
          PUBLIC_ADS_ENABLED: 'false'
        run: |
          npx astro check
          npm run build

      - name: Notify admin of pending official PDFs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'scripts/pending_pdfs.md';
            const title = '[Admin Action] Official PDFs Needed for Verification';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 30,
            });
            const existing = issues.data.find((i) => i.title === title);

            if (fs.existsSync(path)) {
              const body = fs.readFileSync(path, 'utf8');
              if (existing) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                });
              }
            } else if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                body: 'All pending official PDFs have been ingested and verified.',
              });
            }

      - name: Commit and push updated jobs if changed
        run: |
          if [ -n "$(git status --porcelain -- src/data/jobs/ scripts/seen_urls.json scripts/pending_pdfs.json scripts/pending_pdfs.md inbox_pdfs/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/jobs/ scripts/seen_urls.json scripts/pending_pdfs.json scripts/pending_pdfs.md inbox_pdfs/
            git commit -m "chore(jobs): daily recruitment sync $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          else
            echo "No new or updated job files detected; skipping commit."
          fi
